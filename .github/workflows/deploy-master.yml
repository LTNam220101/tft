# Push lên master → deploy Convex production.
# Frontend (Vercel) được deploy tự động bởi Vercel Git Integration
# (connect repo trong Vercel dashboard) — không cần job build/deploy ở đây nữa.
#
# GitHub Secrets cần cấu hình (Settings → Secrets and variables → Actions):
#   CONVEX_DEPLOY_KEY     — Deploy key từ Convex Dashboard (Settings → Deploy Key, production)
#
# Env vars cần cấu hình trong Vercel Project Settings → Environment Variables:
#   VITE_CONVEX_URL       — URL deployment production, ví dụ https://your-deployment.convex.cloud
#   VITE_CDRAGON_PATCH    — CDN base URL cho Community Dragon assets

name: Deploy (Convex)

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-master-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convex-deploy:
    name: Deploy Convex (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy
